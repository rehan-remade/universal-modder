; collapsefix: dinput8.dll proxy for Collapse (2008). Put dinput8.dll, collapsefix.ini next to collapse.exe.
; 1 = on, 0 = off. The log (collapsefix.log, same folder) says what was applied.

[fix]
; C-05: "fullscreen" becomes a borderless window over the whole monitor. Alt+Tab is instant and never loses the
; graphics device. 0 = the game's exclusive fullscreen, where Alt+Tab rebuilds the device (without the leak since
; release_batches=1, tested with 80+ Alt+Tabs).
borderless=1
; C-25: tell Windows the game handles display scaling (125 %, 150 % ...), so its window is sharp and sized right.
dpi_aware=1
; C-05, exclusive fullscreen only (borderless=0): stop the background re-init loop while the game is not in front.
alt_tab=1
; C-11: a fullscreen Resolution your monitor does not support falls back to the desktop mode
; (instead of "Cannot initialize video" / CreateDevice 8876086c and an endless retry). Exclusive fullscreen only.
display_mode=1
; C-12: exclusive fullscreen refresh rate. 0 = same as the desktop (default), -1 = the game's own choice, or Hz.
refresh=0
; C-21: V-Sync. Borderless: present interval ONE (Windows composes anyway). Exclusive: ONE instead of IMMEDIATE.
vsync=0
; C-20: smooth timer. The game measures time in 15.6 ms steps; this gives it 1 ms steps.
timer=1
; C-04: write a line to collapsefix.log when the game fails to create a save file (it does not tell you).
save_log=1
; C-40/C-41: field of view. auto = Hor+: wide screens see more at the sides, nothing is cut at the top and bottom
; (90 degrees at 16:9). 0 = the game's own (and a FOV: line in setup.ini). A number = horizontal degrees, 40..150.
; Cutscenes widen by the same factor.
fov=auto
; C-42: size of the whole interface: frames, icons, text. auto = fits the resolution (125 percent at 1080p,
; 167 at 1440p, 250 at 4K). 100 = the game's own, or a percent, 100..400. The menu keeps its size: it already follows the screen.
ui_scale=auto
; C-53: show key names in English ("Press E") whatever the keyboard layout at launch. Controls do not change.
english_keys=1
; C-44: gamepad, right stick (camera): dead zone in percent, 0..90. 0 = the game's own, 13 percent. If the camera drifts
; by itself on a worn stick, try 30.
pad_camera_deadzone=0
; C-14: log mouse and keyboard errors from DirectInput to collapsefix.log. Changes nothing in the game.
input=1
; C-54: stop the game's navmesh walk at a step limit. Its endless loop freezes the game with the mouse still moving.
nav_guard=1
; C-55: release the level geometry buffers the game forgets on every level load and reload. Without it memory grows
; until a crash after a few hours.
release_batches=1
; C-56: keep one extra mouse device so dinput8 never frees its shared mouse state while its own thread reads it (a crash
; inside dinput8 during a scene load). Nothing reads from that device.
mouse_keeper=1
; C-58: the game's memory allocator could free part of a block, report a failure, then write into the freed part (a
; crash while loading a save). Memory goes back to Windows only when all of the block can go.
heap_guard=1

[log]
enabled=1
; C-55: write the count of live D3D resources to collapsefix.log every 30 s. For testing.
d3d_counts=0
