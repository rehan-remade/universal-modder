org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Minecraft 26.3 and its Fabric API are compiled for Java 25 (class file 69), and the FFM API
# used by SharedMemory is only stable from Java 22. The system default javac stays 21.
org.gradle.java.home=/usr/lib/jvm/java-25-openjdk

# Fabric (Minecraft 26.3 ships unobfuscated: no mappings needed)
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
# Matches the fabric-api jar the passthrough profile actually ships (0.162.0+26.3), so the API used
# here is the API that will be present at runtime.
fabric_api_version=0.162.0+26.3

version=0.1.0
group=dev.sven.blockcraft
