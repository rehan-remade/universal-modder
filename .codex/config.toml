# Codex: project-scoped MCP (trusted projects). fal's hosted MCP server, key from $FAL_KEY.
# Never paste the key here. On Linux, after `um fal key set`, start Codex with
#   export FAL_KEY="$(secret-tool lookup service fal.ai key api)"
[mcp_servers.fal]
url = "https://mcp.fal.ai/mcp"
bearer_token_env_var = "FAL_KEY"
