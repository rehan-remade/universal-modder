name: star chart
on:
  schedule:
    - cron: "17 */6 * * *"
  # GitHub drops scheduled runs under load (none ran in the chart's first 10 hours), so every merge redraws it too.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: star-chart
  cancel-in-progress: true
jobs:
  draw:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Draw the chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/star-chart/star_chart.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP/star-chart/stars.svg"
      # One commit on its own branch, replaced every run: the README shows it, main gets no bot commits.
      - name: Publish it on the star-chart branch
        working-directory: ${{ runner.temp }}/star-chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b star-chart
          git add stars.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "star chart"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" star-chart
